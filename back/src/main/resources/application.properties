
spring.datasource.url=jdbc:mysql://localhost:3306/mdd_db
spring.datasource.username=root
spring.datasource.password=Pwd@2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

server.error.include-message=always

# TODO: Use environment variables for production
jwt.secret=monSecretTresTresLongPourJWT123456789
jwt.expiration=86400000

# Configuration Jackson pour JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL

logging.level.root=WARN

spring.devtools.livereload.enabled=false

spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

