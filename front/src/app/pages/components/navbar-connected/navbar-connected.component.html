<div class="mat-tab-nav-bar">
  <img src="/assets/logo_p6.png" alt="logo" />

  <!-- Navigation desktop -->
  <div class="nav-links desktop-nav">
    <a href="#" class="nav-link">Se déconnecter</a>
    <a routerLink="/posts" class="nav-link" routerLinkActive="active"
      >Articles</a
    >
    <a routerLink="/topics" class="nav-link" routerLinkActive="active"
      >Thèmes</a
    >
    <mat-icon class="user-icon">account_circle</mat-icon>
  </div>

  <!-- Menu hamburger mobile -->
  <div class="mobile-nav">
    <mat-icon class="hamburger-icon" (click)="toggleMenu()">menu</mat-icon>
  </div>
</div>

<!-- Overlay et menu mobile plein écran -->
<div class="mobile-overlay" [class.show]="isMenuOpen" (click)="closeMenu()">
  <div class="mobile-menu-panel" (click)="$event.stopPropagation()">
    <div class="menu-links">
      <a href="#" class="nav-link" (click)="closeMenu()">Se déconnecter</a>
      <a
        routerLink="/posts"
        class="nav-link"
        routerLinkActive="active"
        (click)="closeMenu()"
        >Articles</a
      >
      <a
        routerLink="/topics"
        class="nav-link"
        routerLinkActive="active"
        (click)="closeMenu()"
        >Thèmes</a
      >
    </div>
    <div class="menu-footer">
      <mat-icon class="user-icon">account_circle</mat-icon>
    </div>
  </div>
</div>
