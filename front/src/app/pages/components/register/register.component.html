<app-navbar></app-navbar>

<div class="header">
  <button mat-icon-button (click)="goHome()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h1>Inscription</h1>
</div>
<div class="signin-container">
  <div *ngIf="errorMessage" class="error-message">
    <mat-icon>error</mat-icon>
    <span>{{ errorMessage }}</span>
  </div>
  <form (ngSubmit)="submit()" [formGroup]="form" class="signin-form" novalidate>
    <div class="form-group">
      <label for="username" class="form-label">Nom utilisateur</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput id="username" formControlName="username" required />
        <mat-error
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
        >
          Nom utilisateur requis
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Adresse e-mail</label>
      <mat-form-field appearance="outline" class="full-width">
        <input
          matInput
          id="email"
          type="email"
          formControlName="email"
          required
        />
        <mat-error
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        >
          <span
            *ngIf="
              form.get('email')?.hasError('email') ||
              form.get('email')?.hasError('strictEmail')
            "
          >
            Format d'email invalide
          </span>
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Mot de passe</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput id="password" formControlName="password" required />
        <mat-error
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
        >
          <span *ngIf="form.get('password')?.hasError('required')"
            >Mot de passe requis</span
          >
          <span *ngIf="form.get('password')?.hasError('minlength')"
            >Au moins 8 caractères</span
          >
          <span *ngIf="form.get('password')?.hasError('strongPassword')">
            Le mot de passe doit contenir : un chiffre, une minuscule, une
            majuscule et un caractère spécial
          </span>
        </mat-error>
      </mat-form-field>
    </div>

    <button
      mat-raised-button
      type="submit"
      [disabled]="form.invalid"
      class="btn-primary"
    >
      S'inscrire
    </button>
  </form>
</div>
