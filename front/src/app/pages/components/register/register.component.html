<app-navbar></app-navbar>

<div class="header">
  <h1>Inscription</h1>
  <button mat-icon-button (click)="goHome()">
    <mat-icon>arrow_back</mat-icon>
  </button>
</div>
<div class="signup-container">
  <form (ngSubmit)="submit()" [formGroup]="form" class="signup-form" novalidate>
    <div class="form-group">
      <label for="username" class="form-label">Nom utilisateur</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput id="username" formControlName="username" required />
        <mat-error
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
        >
          Nom utilisateur requis
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Adresse e-mail</label>
      <mat-form-field appearance="outline" class="full-width">
        <input
          matInput
          id="email"
          type="email"
          formControlName="email"
          required
        />
        <mat-error
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        >
          Email valide requis
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Mot de passe</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput id="password" formControlName="password" required />
        <mat-error
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
        >
          Mot de passe requis
        </mat-error>
      </mat-form-field>
    </div>

    <button
      mat-raised-button
      type="submit"
      [disabled]="form.invalid"
      class="btn-primary"
    >
      S'inscrire
    </button>
  </form>
</div>
