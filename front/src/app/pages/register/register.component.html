<form [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label for="username">Nom d'utilisateur</label>
    <input id="username" type="text" formControlName="username" />
    <div
      *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
      style="color: red"
    >
      Le nom d'utilisateur est obligatoire.
    </div>
  </div>

  <div>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
    <div
      *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
      style="color: red"
    >
      Email invalide ou obligatoire.
    </div>
  </div>

  <div>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" formControlName="password" />
    <div
      *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
      style="color: red"
    >
      Mot de passe obligatoire (min 6 caractères).
    </div>
  </div>

  <button type="submit" [disabled]="form.invalid">S'inscrire</button>

  <div *ngIf="errorMessage" style="color: red; margin-top: 10px">
    {{ errorMessage }}
  </div>
</form>
